<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सिंचाई समय सारणी (Irrigation Schedule)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; }
        .admin-section { background: #e8f4f8; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px solid #bce8f1; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; color: white; }
        .btn-green { background-color: #28a745; }
        .btn-blue { background-color: #007bff; }
        .btn-purple { background-color: #6f42c1; }
        .btn-red { background-color: #dc3545; }
        .btn-admin { background-color: #343a40; float: right; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="time"] { width: 100%; padding: 8px; box-sizing: border-box; }
        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 15% auto; padding: 20px; width: 300px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn btn-admin" onclick="openAdminModal()">🔐 Admin Edit</button>
    <h1>सिंचाई समय सारणी (Irrigation Schedule)</h1>
    <hr>

    <!-- Admin Panel -->
    <div class="admin-section" id="adminPanel" style="display: none;">
        <h2>एडमिन सेटिंग्स (Admin Only)</h2>
        
        <div class="form-group">
            <label>पानी बाँटने का तरीका चुनें:</label>
            <input type="radio" id="straight" name="mode" value="straight" checked>
            <label for="straight" style="display:inline;"> 1. लगातार (Straight)</label> &nbsp;&nbsp;
            <input type="radio" id="oddEven" name="mode" value="oddEven">
            <label for="oddEven" style="display:inline;"> 2. ऑड-इवन (Odd-Even)</label>
        </div>

        <div class="form-group">
            <label>कुल उपलब्ध पानी समय (घंटे):</label>
            <input type="number" id="totalHours" value="24">
        </div>

        <div class="form-group">
            <label>कुल घंटे बाँटने हैं:</label>
            <input type="number" id="allocatedHours" value="23">
        </div>

        <div class="form-group">
            <label>शुरुआती समय (Start):</label>
            <input type="time" id="startTime" value="07:00">
        </div>

        <button class="btn btn-green" onclick="saveDataToCloud()">☁️ गूगल शीट में सेव करें</button>
        <button class="btn btn-purple" onclick="changePassword()">🔑 पासवर्ड बदलें</button>
    </div>
</div>

<!-- Password Modal -->
<div id="passwordModal" class="modal">
    <div class="modal-content">
        <h3>एडमिन लॉगिन</h3>
        <p>पासवर्ड दर्ज करें:</p>
        <input type="password" id="adminPassInput" placeholder="Password"><br><br>
        <button class="btn btn-blue" onclick="checkPassword()">Login</button>
        <button class="btn btn-red" onclick="closeAdminModal()">Cancel</button>
    </div>
</div>

<script>
    // 1. Google Script URL (Fixed Syntax)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzV9vAcUjG5_kzxUvF0W1jKh_Wv-VH9q2oq4KILsq9c14vLmtJWtgTu7Hrg-H3WKinYmg/exec";
    
    let isAdmin = false;
    let adminPassword = localStorage.getItem("adminPassword") || "2050";

    function openAdminModal() {
        if (isAdmin) {
            document.getElementById("adminPanel").style.display = "block";
        } else {
            document.getElementById("passwordModal").style.display = "block";
        }
    }

    function closeAdminModal() {
        document.getElementById("passwordModal").style.display = "none";
    }

    function checkPassword() {
        const input = document.getElementById("adminPassInput").value;
        if (input === adminPassword) {
            isAdmin = true;
            document.getElementById("adminPanel").style.display = "block";
            closeAdminModal();
            alert("लॉगिन सफल!");
        } else {
            alert("गलत पासवर्ड! Default Password '2050' है।");
        }
    }

    function changePassword() {
        const newPass = prompt("नया पासवर्ड दर्ज करें:");
        if (newPass) {
            adminPassword = newPass;
            localStorage.setItem("adminPassword", newPass);
            alert("पासवर्ड सफलतापूर्वक बदल गया!");
        }
    }

    function saveDataToCloud() {
        const data = {
            totalHours: document.getElementById("totalHours").value,
            allocatedHours: document.getElementById("allocatedHours").value,
            startTime: document.getElementById("startTime").value,
            mode: document.querySelector('input[name="mode"]:checked').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
        .then(() => alert("डेटा Google Sheet में सेव करने का अनुरोध भेज दिया गया है!"))
        .catch(err => alert("Error: " + err));
    }
</script>

</body>
</html>
